<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e4">
<title>波点工厂 · Polka Maker</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('polka-lang');
      if (saved === 'en' || saved === 'zh') {
        document.documentElement.dataset.lang = saved;
        document.documentElement.lang = saved === 'zh' ? 'zh-CN' : 'en';
      }
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2e4;
  --paper-2:#f0e8d8;
  --paper-3:#e8dfc8;
  --ink:#4a4040;
  --ink-soft:#6b5e5e;
  --ink-faint:#a89696;
  --lilac:#b8a0d8;
  --lilac-soft:#d8c8e8;
  --pink:#e8b4d0;
  --teal:#5fb3b3;
  --teal-deep:#3d9090;
  --line:#c9bcd0;

  --font-title: 'ZCOOL KuaiLe','Press Start 2P',system-ui,sans-serif;
  --font-label: 'ZCOOL QingKe HuangYou','VT323',system-ui,sans-serif;
  --font-mono:  'VT323','ZCOOL QingKe HuangYou','Courier New',monospace;
  --font-en:    'Press Start 2P',monospace;

  --fs-title: 22px;
  --fs-sub: 16px;
  --fs-section: 15px;
  --fs-btn: 14px;
  --fs-btn-sm: 13px;
  --fs-chip: 13px;
  --fs-tag: 13px;
  --fs-color-name: 14px;
  --fs-label: 14px;
  --fs-drop-label: 13px;
  --fs-drop-hint: 15px;
  --fs-de-hint: 14px;

  --panel-w: 340px;
  --header-pad-x: 26px;
  --header-pad-y: 16px;
  --panel-pad: 18px 16px;
  --stage-pad: 28px;
  --panel-gap: 16px;
  --controls-gap: 10px;
}
:root[data-lang="en"]{
  --font-title: 'Press Start 2P','ZCOOL KuaiLe',monospace;
  --font-label: 'VT323','ZCOOL QingKe HuangYou',system-ui,sans-serif;
  --font-mono:  'VT323',monospace;
  --font-en:    'Press Start 2P',monospace;

  --fs-title: 14px;
  --fs-sub: 18px;
  --fs-section: 10px;
  --fs-btn: 10px;
  --fs-btn-sm: 9px;
  --fs-chip: 9px;
  --fs-tag: 13px;
  --fs-color-name: 8px;
  --fs-label: 15px;
  --fs-drop-label: 8px;
  --fs-drop-hint: 16px;
  --fs-de-hint: 15px;
}

*{box-sizing:border-box}
html,body{margin:0}

button, .chip, .color-item, select, input, .drop {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

body{
  min-height: 100vh;
  min-height: 100dvh;
  display:flex;flex-direction:column;
  background:var(--paper);
  color:var(--ink);
  font:16px/1.45 var(--font-label);
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image:radial-gradient(circle,rgba(184,160,216,.22) 1px,transparent 1.4px);
  background-size:8px 8px;
  mix-blend-mode:multiply;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.4'/></svg>");
}

/* 装饰 */
.deco{position:fixed;pointer-events:none;z-index:2;color:var(--lilac);opacity:.75}
.deco-tl{top:-30px;left:-40px;width:320px;height:320px}
.deco-tr{top:-20px;right:-30px;width:260px;height:260px;color:var(--pink)}
.deco-bl{bottom:-40px;left:-30px;width:280px;height:280px;color:var(--pink)}
.deco-br{bottom:-30px;right:-40px;width:300px;height:300px;color:var(--lilac)}
.deco-star{position:fixed;pointer-events:none;z-index:2;color:var(--teal);opacity:.7}
.deco-star.s1{top:80px;right:22%;width:26px}
.deco-star.s2{top:34%;left:20px;width:18px}
.deco-star.s3{bottom:12%;right:20px;width:22px}

/* ============ Header ============ */
header{
  position:sticky;top:0;z-index:30;
  flex:none;padding:var(--header-pad-y) var(--header-pad-x) 12px;
  border-bottom:2px dashed var(--line);
  display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
  background:var(--paper);
}
header h1{
  margin:0;
  font-family:var(--font-title);
  font-size:var(--fs-title);line-height:1.15;
  color:var(--ink);
  letter-spacing:.02em;
}
header h1 em{
  font-style:normal;color:var(--teal);
  margin-right:8px;
  font-family:var(--font-en);
  font-size:14px;vertical-align:3px;
}
header .sub{
  font-family:var(--font-label);
  font-size:var(--fs-sub);color:var(--ink-soft);
  letter-spacing:.04em;
}
.header-right{
  margin-left:auto;
  display:flex;align-items:center;gap:10px;
}
header .stamp{
  font-family:var(--font-en);font-size:9px;
  color:var(--paper);background:var(--ink);
  padding:5px 8px;letter-spacing:.08em;
  transform:rotate(-1.5deg);
  box-shadow:3px 3px 0 var(--pink);
}
.lang-btn{
  font-family:var(--font-en);font-size:10px;
  color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);cursor:pointer;
  padding:5px 10px 6px;letter-spacing:.06em;
  box-shadow:3px 3px 0 var(--ink);
  transition:.1s;line-height:1.1;
  min-width:44px;min-height:36px;
}
.lang-btn:hover{background:var(--lilac-soft);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.lang-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

/* ============ 主布局 ============ */
.wrap{
  position:relative;z-index:3;
  flex:1;
  display:grid;
  grid-template-columns:var(--panel-w) 1fr;
  grid-template-areas:"panel stage";
  align-items:start;
}
.panel{
  grid-area:panel;
  border-right:2px dashed var(--line);
  padding:var(--panel-pad);
  display:flex;flex-direction:column;gap:var(--panel-gap);
  background:rgba(255,255,255,.28);
}

/* ============ 上传 ============ */
.drop{
  position:relative;
  border:2px dashed var(--ink-soft);
  padding:16px 12px;
  text-align:center;cursor:pointer;
  background:rgba(255,255,255,.55);
  transition:.22s ease;
  transform:rotate(-.6deg);
}
.drop:hover,.drop.over{
  border-color:var(--teal);
  background:rgba(95,179,179,.08);
  transform:rotate(0deg);
}
.drop::before{
  content:attr(data-label);
  position:absolute;top:-11px;left:12px;
  font-family:var(--font-title);font-size:var(--fs-drop-label);
  color:var(--paper);background:var(--ink);
  padding:1px 8px 3px;letter-spacing:.1em;
  line-height:1.2;
}
.drop:hover::before,.drop.over::before{background:var(--teal)}
.drop-hint{
  font-family:var(--font-label);
  font-size:var(--fs-drop-hint);color:var(--ink-soft);
  letter-spacing:.04em;
}
.drop-hint strong{
  color:var(--teal);
  font-family:var(--font-title);
  font-weight:400;font-size:var(--fs-drop-hint);
  margin-right:4px;
}
#thumb{
  width:100%;display:block;margin-bottom:10px;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--lilac);
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{from{opacity:0;transform:rotate(-1deg) scale(.97)}to{opacity:1;transform:rotate(-.6deg)}}

/* 自定义图片上传区（内嵌） */
#customDrop{
  padding:10px;
  transform:none;
}
#customDrop::before{
  content:attr(data-label);
  top:-10px;left:10px;font-size:12px;
}
#customDrop:hover{transform:none}
#customPreview{
  width:100%;max-height:80px;object-fit:contain;
  display:block;margin:0 auto 6px;
  background:
    linear-gradient(45deg,var(--paper-3) 25%,transparent 25%) 0 0/10px 10px,
    linear-gradient(-45deg,var(--paper-3) 25%,transparent 25%) 0 5px/10px 10px,
    linear-gradient(45deg,transparent 75%,var(--paper-3) 75%) 5px -5px/10px 10px,
    linear-gradient(-45deg,transparent 75%,var(--paper-3) 75%) -5px 0/10px 10px;
  border:1px solid var(--line);
}

/* 格式要求提示 */
.format-note{
  margin:6px 2px 0;
  font-family:var(--font-label);
  font-size:12px;
  line-height:1.5;
  color:var(--ink-faint);
  letter-spacing:.02em;
}
.format-note strong{
  color:var(--teal-deep);
  font-weight:400;
  font-family:var(--font-title);
  font-size:12px;
}

/* ============ Section ============ */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-title);font-size:var(--fs-section);
  color:var(--ink);letter-spacing:.05em;
  padding-bottom:6px;
  border-bottom:2px solid var(--ink);
  line-height:1.2;
}
.sec-head .mark{color:var(--pink);margin-right:6px}
.src-tag{
  font-family:var(--font-label);font-size:var(--fs-tag);
  padding:1px 8px 3px;letter-spacing:.04em;
  background:var(--teal);color:var(--paper);
  border:1.5px solid var(--ink);line-height:1.2;
}
.src-tag.manual{background:var(--pink)}

/* ============ 颜色 ============ */
.color-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-item{
  display:flex;flex-direction:column;gap:6px;padding:9px;
  border:2px solid var(--ink);background:rgba(255,255,255,.7);
  cursor:pointer;transition:.18s;
  box-shadow:3px 3px 0 var(--ink);
}
.color-item:nth-child(1){transform:rotate(-.8deg)}
.color-item:nth-child(2){transform:rotate(.8deg)}
.color-item:hover{transform:rotate(0deg) translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.color-item input[type=color]{
  width:100%;height:44px;padding:0;
  border:1.5px solid var(--ink);border-radius:0;
  background:none;cursor:pointer;
}
.color-item input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color-item input[type=color]::-webkit-color-swatch{border:none;border-radius:0}
.color-item input[type=color]::-moz-color-swatch{border:none;border-radius:0}
.color-name{
  font-family:var(--font-title);font-size:var(--fs-color-name);
  color:var(--ink-soft);letter-spacing:.06em;line-height:1.2;
}
.color-hex{font-family:var(--font-mono);font-size:15px;color:var(--ink)}

.contrast-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 10px;background:var(--paper-2);
  border:1.5px solid var(--ink);
  font-family:var(--font-mono);font-size:15px;
}
.de-value{
  color:var(--paper);background:var(--ink);
  padding:1px 7px 3px;font-size:14px;line-height:1.2;
}
.de-hint{
  color:var(--ink-soft);
  font-family:var(--font-label);font-size:var(--fs-de-hint);
  letter-spacing:.03em;
}
.de-hint.warn{color:#c46a3d}
.de-hint.good{color:var(--teal-deep)}

/* ============ 滑杆 ============ */
.slider-row{display:flex;flex-direction:column;gap:6px}
.slider-label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--font-label);font-size:var(--fs-label);color:var(--ink-soft);
  letter-spacing:.04em;
}
.slider-label .v{
  color:var(--ink);background:var(--lilac-soft);
  padding:0 6px;font-family:var(--font-mono);font-size:15px;
}
input[type=range]{
  width:100%;margin:0;
  -webkit-appearance:none;appearance:none;
  height:6px;background:var(--paper-3);
  border:1.5px solid var(--ink);cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;background:var(--teal);
  border:2px solid var(--ink);border-radius:0;cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;background:var(--teal);
  border:2px solid var(--ink);border-radius:0;cursor:pointer;
}

/* ============ 下拉与数字 ============ */
.select-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;font-family:var(--font-label);font-size:var(--fs-label);
  color:var(--ink-soft);letter-spacing:.04em;
}
select,input[type=number]{
  font-family:var(--font-label);font-size:14px;
  background:rgba(255,255,255,.7);color:var(--ink);
  border:1.5px solid var(--ink);border-radius:0;
  padding:4px 8px;
}
select{flex:1;min-height:36px}
input[type=number]{width:100%;-moz-appearance:textfield;font-family:var(--font-mono);font-size:15px}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:var(--font-title);font-size:var(--fs-chip);
  padding:5px 9px 7px;letter-spacing:.04em;
  background:rgba(255,255,255,.6);color:var(--ink-soft);
  border:1.5px solid var(--ink);cursor:pointer;
  transition:.12s;box-shadow:2px 2px 0 var(--ink);
  line-height:1.1;
}
.chip:hover{
  background:var(--lilac-soft);color:var(--ink);
  transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);
}
.chip.active{
  background:var(--teal);color:var(--paper);
  transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);
}

/* ============ 按钮 ============ */
.btn{
  font-family:var(--font-title);font-size:var(--fs-btn);
  letter-spacing:.06em;
  padding:9px 12px 11px;
  background:var(--paper);color:var(--ink);
  border:2px solid var(--ink);cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);
  transition:.1s;line-height:1.15;
}
.btn:hover{background:var(--lilac-soft);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--teal);color:var(--paper)}
.btn.primary:hover{background:var(--teal-deep)}
.btn.small{font-size:var(--fs-btn-sm);padding:6px 10px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--controls-gap);margin-top:auto;padding-top:12px}

hr{border:none;border-top:2px dashed var(--line);margin:4px 0}

/* ============ 预览区 ============ */
.stage{
  grid-area:stage;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:var(--stage-pad);
  min-height:420px;
  background:
    radial-gradient(circle at 30% 20%,rgba(232,180,208,.18),transparent 55%),
    radial-gradient(circle at 75% 80%,rgba(95,179,179,.14),transparent 55%),
    var(--paper-2);
  overflow:hidden;
}
.stage::before{
  content:attr(data-label);
  position:absolute;top:14px;left:22px;
  font-family:var(--font-title);font-size:15px;
  color:var(--ink-faint);letter-spacing:.15em;line-height:1.2;
}
.stage::after{
  content:'100%';
  position:absolute;bottom:16px;right:22px;
  font-family:var(--font-en);font-size:9px;
  color:var(--ink-faint);letter-spacing:.1em;
  transform:rotate(-3deg);
}
#preview{
  max-width:100%;max-height:80vh;
  border:2px solid var(--ink);
  box-shadow:6px 6px 0 var(--lilac),12px 12px 0 var(--pink);
  background:#fff;
  image-rendering: auto;
}
#preview[data-shape="square"]{
  image-rendering: pixelated;
}

/* ============ Debug ============ */
.debug{
  position:fixed;left:calc(var(--panel-w) + 18px);top:76px;
  width:340px;max-height:calc(100vh - 110px);
  max-height:calc(100dvh - 110px);
  overflow-y:auto;
  background:rgba(247,242,228,.96);
  border:2px solid var(--ink);
  box-shadow:5px 5px 0 var(--pink);
  padding:14px;font-size:14px;z-index:100;
  display:flex;flex-direction:column;gap:10px;
  font-family:var(--font-label);
}
.debug.hidden{display:none}
.debug h3{
  margin:0;font-family:var(--font-title);font-size:14px;
  color:var(--ink);letter-spacing:.1em;
  padding-bottom:4px;border-bottom:1.5px solid var(--ink);
  line-height:1.2;
}
.debug .kv{
  display:grid;grid-template-columns:auto 1fr;gap:4px 12px;
  color:var(--ink-soft);font-size:14px;
}
.debug .kv b{color:var(--ink);font-weight:400;font-family:var(--font-mono);font-size:15px}
.debug .cands{display:flex;gap:5px;flex-wrap:wrap}
.debug .cands span{width:24px;height:24px;border:1.5px solid var(--ink)}
.debug img{width:100%;border:1.5px solid var(--ink);background:#fff}
.debug .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ==================================================================
   平板：768px — 1023px
   ================================================================== */
@media (min-width: 768px) and (max-width: 1023px){
  :root{
    --panel-w: 300px;
    --header-pad-x: 20px;
    --panel-pad: 14px 14px;
    --stage-pad: 20px;
    --panel-gap: 14px;
  }
  header h1{font-size: calc(var(--fs-title) - 2px)}
  .drop{padding:14px 10px}
  .color-item input[type=color]{height:40px}
}

/* ==================================================================
   手机：< 768px
   ================================================================== */
@media (max-width: 767px){
  :root{
    --header-pad-x: 14px;
    --header-pad-y: 10px;
    --panel-pad: 14px 14px 100px;
    --stage-pad: 12px;
    --panel-gap: 14px;
    --controls-gap: 8px;

    --fs-title: 18px;
    --fs-section: 14px;
    --fs-btn: 13px;
    --fs-btn-sm: 12px;
    --fs-chip: 12px;
    --fs-tag: 12px;
    --fs-label: 13px;
    --fs-color-name: 13px;
    --fs-drop-hint: 14px;
    --fs-de-hint: 13px;
  }
  :root[data-lang="en"]{
    --fs-title: 11px;
    --fs-section: 9px;
    --fs-btn: 9px;
    --fs-btn-sm: 8px;
    --fs-chip: 8px;
    --fs-tag: 12px;
    --fs-label: 14px;
    --fs-color-name: 8px;
    --fs-drop-hint: 15px;
    --fs-de-hint: 14px;
  }

  body{
    display:block;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header{
    position:relative;
    top:auto;
    padding:10px 14px 8px;
    gap:10px;
    flex-wrap:nowrap;
  }
  header h1{font-size:var(--fs-title)}
  header .sub{display:none}
  header .stamp{display:none}
  header h1 em{font-size:12px;vertical-align:2px;margin-right:6px}
  .lang-btn{
    padding:5px 9px 7px;
    min-width:44px;min-height:38px;
    font-size:11px;
  }

  .wrap{
    display:block;
  }

  .stage{
    position:sticky;
    top:0;
    z-index:5;
    height:40vh;
    height:40dvh;
    min-height:200px;
    max-height:340px;
    padding:12px;
    background:var(--paper-2);
    border-bottom:2px dashed var(--line);
  }
  .stage::before{top:8px;left:14px;font-size:12px;opacity:.7}
  .stage::after{bottom:8px;right:14px;font-size:8px}
  #preview{
    max-height:calc(100% - 8px);
    box-shadow:4px 4px 0 var(--lilac),8px 8px 0 var(--pink);
  }

  .panel{
    border-right:none;
    background:transparent;
    padding:var(--panel-pad);
    gap:var(--panel-gap);
  }

  .deco{opacity:.28}
  .deco-star{opacity:.35}
  .deco-star.s1,.deco-star.s2{display:none}

  .drop{padding:14px 10px}
  .color-item{padding:8px}
  .color-item input[type=color]{height:44px}
  .contrast-row{padding:7px 10px}

  .actions{
    position:fixed;
    left:0;right:0;bottom:0;
    margin:0;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--paper);
    border-top:2px dashed var(--line);
    box-shadow:0 -4px 14px rgba(74,64,64,.08);
    z-index:20;
    gap:10px;
  }
  .actions .btn{
    padding:12px 10px 14px;
    font-size:var(--fs-btn);
    min-height:46px;
  }

/* ============================ ColorService ============================== */
const ColorService = (() => {
  const srgbToLinear = (c) => {
    c /= 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  const linearToSrgb = (c) => {
    const v = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    return Math.max(0, Math.min(255, Math.round(v * 255)));
  };
  function rgbToXyz(r, g, b) {
    const R = srgbToLinear(r), G = srgbToLinear(g), B = srgbToLinear(b);
    return {
      x: R * 0.4124564 + G * 0.3575761 + B * 0.1804375,
      y: R * 0.2126729 + G * 0.7151522 + B * 0.0721750,
      z: R * 0.0193339 + G * 0.1191920 + B * 0.9503041,
    };
  }
  function xyzToRgb(x, y, z) {
    const R =  x * 3.2404542 + y * -1.5371385 + z * -0.4985314;
    const G = x * -0.9692660 + y *  1.8760108 + z *  0.0415560;
    const B = x *  0.0556434 + y * -0.2040259 + z *  1.0572252;
    return { r: linearToSrgb(R), g: linearToSrgb(G), b: linearToSrgb(B) };
  }
  const Xn = 0.95047, Yn = 1.0, Zn = 1.08883;
  function xyzToLab(x, y, z) {
    const f = tt => tt > 0.008856 ? Math.cbrt(tt) : (7.787 * tt + 16 / 116);
    const fx = f(x / Xn), fy = f(y / Yn), fz = f(z / Zn);
    return { L: 116 * fy - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
  }
  function labToXyz(L, a, b) {
    const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
    const fInv = tt => { const t3 = tt * tt * tt; return t3 > 0.008856 ? t3 : (tt - 16 / 116) / 7.787; };
    return { x: Xn * fInv(fx), y: Yn * fInv(fy), z: Zn * fInv(fz) };
  }
  const rgbToLab = (r, g, b) => {
    const { x, y, z } = rgbToXyz(r, g, b);
    return xyzToLab(x, y, z);
  };
  const labToRgb = (L, a, b) => {
    const { x, y, z } = labToXyz(L, a, b);
    return xyzToRgb(x, y, z);
  };
  const deltaE76 = (l1, l2) => {
    const dL = l1.L - l2.L, da = l1.a - l2.a, db = l1.b - l2.b;
    return Math.sqrt(dL * dL + da * da + db * db);
  };
  function deltaE2000(lab1, lab2) {
    const { L: L1, a: a1, b: b1 } = lab1;
    const { L: L2, a: a2, b: b2 } = lab2;
    const kL = 1, kC = 1, kH = 1;
    const C1 = Math.sqrt(a1 * a1 + b1 * b1);
    const C2 = Math.sqrt(a2 * a2 + b2 * b2);
    const Cbar = (C1 + C2) / 2;
    const Cbar7 = Math.pow(Cbar, 7);
    const G = 0.5 * (1 - Math.sqrt(Cbar7 / (Cbar7 + Math.pow(25, 7))));
    const a1p = (1 + G) * a1, a2p = (1 + G) * a2;
    const C1p = Math.sqrt(a1p * a1p + b1 * b1);
    const C2p = Math.sqrt(a2p * a2p + b2 * b2);
    const h1p = (Math.atan2(b1, a1p) * 180 / Math.PI + 360) % 360;
    const h2p = (Math.atan2(b2, a2p) * 180 / Math.PI + 360) % 360;
    const dLp = L2 - L1;
    const dCp = C2p - C1p;
    let dhp = 0;
    if (C1p * C2p !== 0) {
      dhp = h2p - h1p;
      if (dhp > 180) dhp -= 360;
      else if (dhp < -180) dhp += 360;
    }
    const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp * Math.PI / 360);
    const Lbarp = (L1 + L2) / 2;
    const Cbarp = (C1p + C2p) / 2;
    let hbarp;
    if (C1p * C2p === 0) hbarp = h1p + h2p;
    else {
      const diff = Math.abs(h1p - h2p);
      if (diff <= 180) hbarp = (h1p + h2p) / 2;
      else if (h1p + h2p < 360) hbarp = (h1p + h2p + 360) / 2;
      else hbarp = (h1p + h2p - 360) / 2;
    }
    const T = 1
      - 0.17 * Math.cos((hbarp - 30) * Math.PI / 180)
      + 0.24 * Math.cos((2 * hbarp) * Math.PI / 180)
      + 0.32 * Math.cos((3 * hbarp + 6) * Math.PI / 180)
      - 0.20 * Math.cos((4 * hbarp - 63) * Math.PI / 180);
    const dTheta = 30 * Math.exp(-Math.pow((hbarp - 275) / 25, 2));
    const Cbarp7 = Math.pow(Cbarp, 7);
    const Rc = 2 * Math.sqrt(Cbarp7 / (Cbarp7 + Math.pow(25, 7)));
    const Sl = 1 + (0.015 * Math.pow(Lbarp - 50, 2)) / Math.sqrt(20 + Math.pow(Lbarp - 50, 2));
    const Sc = 1 + 0.045 * Cbarp;
    const Sh = 1 + 0.015 * Cbarp * T;
    const Rt = -Math.sin(2 * dTheta * Math.PI / 180) * Rc;
    const tL = dLp / (kL * Sl);
    const tC = dCp / (kC * Sc);
    const tH = dHp / (kH * Sh);
    return Math.sqrt(tL * tL + tC * tC + tH * tH + Rt * tC * tH);
  }
  const deltaELab = (l1, l2, f = CONFIG.color.deltaEFormula) =>
    f === 'CIE76' ? deltaE76(l1, l2) : deltaE2000(l1, l2);
  const deltaE = (rgb1, rgb2, f = CONFIG.color.deltaEFormula) => {
    const l1 = rgbToLab(rgb1.r, rgb1.g, rgb1.b);
    const l2 = rgbToLab(rgb2.r, rgb2.g, rgb2.b);
    return deltaELab(l1, l2, f);
  };
  function adjustForContrast(color, targetLab, targetDE) {
    const base = rgbToLab(color.r, color.g, color.b);
    const baseDE = deltaE2000(base, targetLab);
    let best = { r: color.r, g: color.g, b: color.b };
    let bestDE = baseDE;
    for (const dir of [1, -1]) {
      let lab = { ...base };
      for (let iter = 0; iter < 60; iter++) {
        lab.L = Math.max(0, Math.min(100, lab.L + dir * 4));
        const rgb = labToRgb(lab.L, lab.a, lab.b);
        const dE = deltaE2000(rgbToLab(rgb.r, rgb.g, rgb.b), targetLab);
        if (dE > bestDE) { bestDE = dE; best = rgb; }
        if (dE >= targetDE) return rgb;
        if (lab.L <= 0 || lab.L >= 100) break;
      }
    }
    return best;
  }
  return { rgbToLab, labToRgb, deltaE, deltaELab, deltaE76, deltaE2000, adjustForContrast };
})();

/* ============================ ColorExtractor ============================ */
const ColorExtractor = (() => {
  function sampleToCanvas(img, N) {
    const cv = document.createElement('canvas');
    cv.width = N; cv.height = N;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const scale = Math.max(N / iw, N / ih);
    const dw = iw * scale, dh = ih * scale;
    ctx.drawImage(img, (N - dw) / 2, (N - dh) / 2, dw, dh);
    return cv;
  }
  function buildCandidates(sampleCanvas, q) {
    const ctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
    const { width: W, height: H } = sampleCanvas;
    const data = ctx.getImageData(0, 0, W, H).data;
    const step = 256 / q;
    const buckets = new Map();
    let total = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i + 3] < 125) continue;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const qr = Math.min(q - 1, r / step | 0);
      const qg = Math.min(q - 1, g / step | 0);
      const qb = Math.min(q - 1, b / step | 0);
      const key = (qr << 10) | (qg << 5) | qb;
      let e = buckets.get(key);
      if (!e) { e = { n: 0, r: 0, g: 0, b: 0 }; buckets.set(key, e); }
      e.n++; e.r += r; e.g += g; e.b += b;
      total++;
    }
    if (!total) return [];
    return [...buckets.values()]
      .map(e => {
        const r = Math.round(e.r / e.n), g = Math.round(e.g / e.n), b = Math.round(e.b / e.n);
        return { n: e.n, ratio: e.n / total, r, g, b, lab: ColorService.rgbToLab(r, g, b) };
      })
      .sort((a, b) => b.n - a.n);
  }
  function pickColorPair(candidates, minDeltaE) {
    const fallback = CONFIG.extractor.fallbackColors.map(h => {
      const n = parseInt(h.slice(1), 16);
      const c = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      return { ...c, lab: ColorService.rgbToLab(c.r, c.g, c.b) };
    });
    if (!candidates.length) {
      return { dotColor: fallback[1], backgroundColor: fallback[0] };
    }
    const c1 = { ...candidates[0] };
    let best = null, bestScore = -1, maxDE = 0, maxCand = null;
    for (let i = 1; i < candidates.length; i++) {
      const c = candidates[i];
      const dE = ColorService.deltaELab(c1.lab, c.lab);
      if (dE > maxDE) { maxDE = dE; maxCand = c; }
      if (dE >= minDeltaE) {
        const score = Math.pow(c.ratio, 0.5) * (dE / 100) * Math.log(1 + c.n);
        if (score > bestScore) { bestScore = score; best = c; }
      }
    }
    let c2 = best || maxCand || { ...c1 };
    if (ColorService.deltaELab(c1.lab, c2.lab) < minDeltaE) {
      const adjusted = ColorService.adjustForContrast(
        { r: c2.r, g: c2.g, b: c2.b }, c1.lab, minDeltaE
      );
      c2 = { ...adjusted, lab: ColorService.rgbToLab(adjusted.r, adjusted.g, adjusted.b) };
    }
    let dotC, bgC;
    if (c1.lab.L <= c2.lab.L) { dotC = c1; bgC = c2; }
    else { dotC = c2; bgC = c1; }
    return {
      dotColor: { r: dotC.r, g: dotC.g, b: dotC.b },
      backgroundColor: { r: bgC.r, g: bgC.g, b: bgC.b },
    };
  }
  function extract(img) {
    const N = CONFIG.color.sampleResolution;
    const sample = sampleToCanvas(img, N);
    const candidates = buildCandidates(sample, CONFIG.color.quantizeLevels);
    const pair = pickColorPair(candidates, CONFIG.color.minDeltaE);
    return { ...pair, sampleCanvas: sample, candidates };
  }
  return { extract };
})();

/* ============================== DotEngine =============================== */
const DotEngine = (() => {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function compute(W, H, p) {
    const { radius, gap, arrangement, seed } = p;
    const jitter = p.jitter;
    const sizeVariance = p.sizeVariance;
    const rnd = mulberry32(seed);
    const dots = [];
    const step = Math.max(1, radius * 2 + gap);
    if (arrangement === 'random') {
      const count = Math.min(200000, Math.ceil((W * H) / (step * step) * 1.6));
      for (let i = 0; i < count; i++) {
        dots.push({
          x: rnd() * W, y: rnd() * H,
          r: Math.max(0.4, radius * (1 + (rnd() - 0.5) * sizeVariance)),
        });
      }
      return dots;
    }
    const rowH = arrangement === 'hex' ? step * Math.sqrt(3) / 2 : step;
    const cols = Math.ceil(W / step) + 2;
    const rows = Math.ceil(H / rowH) + 2;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const offset = (arrangement === 'hex' && (row & 1)) ? step / 2 : 0;
        const x = col * step + offset - step + (rnd() - 0.5) * step * jitter;
        const y = row * rowH - rowH + (rnd() - 0.5) * rowH * jitter;
        const r = Math.max(0.4, radius * (1 + (rnd() - 0.5) * sizeVariance));
        dots.push({ x, y, r });
      }
    }
    return dots;
  }
  return { compute };
})();

/* =========================== CanvasRenderer ============================= */
const CanvasRenderer = (() => {
  let canvas, ctx;
  function init(el) { canvas = el; ctx = el.getContext('2d'); }

  const rgbToHex = (c) => '#' + [c.r, c.g, c.b]
    .map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'))
    .join('');

  function addHeartPath(c, x, y, r) {
    const s = r / 15;
    const segments = 72;
    for (let i = 0; i <= segments; i++) {
      const tt = (i / segments) * Math.PI * 2;
      const st = Math.sin(tt);
      const hx = 16 * st * st * st;
      const hy = -(13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt)) - 6;
      const px = x + hx * s;
      const py = y + hy * s;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
  }

  function addStarPath(c, x, y, r) {
    const outer = r * 1.0;
    const inner = r * 0.382;
    const rot = -Math.PI / 2;
    for (let i = 0; i < 10; i++) {
      const ang = rot + (i * Math.PI) / 5;
      const rad = (i % 2 === 0) ? outer : inner;
      const px = x + Math.cos(ang) * rad;
      const py = y + Math.sin(ang) * rad;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
  }

  function addDropPath(c, x, y, r) {
    const rc = r * 0.67;
    const cy = y + r - rc;
    const tipY = y - r;

    const d = cy - tipY;
    const sA = rc / d;
    const cA = Math.sqrt(1 - sA * sA);

    const rtx = x + rc * cA;
    const rty = cy - rc * sA;
    const ltx = x - rc * cA;
    const lty = cy - rc * sA;

    const tanLen = Math.sqrt(d * d - rc * rc);
    const k1 = tanLen * 0.55;
    const k2 = tanLen * 0.32;

    c.moveTo(x, tipY);

    c.bezierCurveTo(
      x + sA * k1,   tipY + cA * k1,
      rtx - sA * k2, rty - cA * k2,
      rtx, rty
    );

    let sa = Math.atan2(rty - cy, rtx - x);
    let ea = Math.atan2(lty - cy, ltx - x);
    c.arc(x, cy, rc, sa, ea, false);

    c.bezierCurveTo(
      ltx + sA * k2, lty - cA * k2,
      x - sA * k1,   tipY + cA * k1,
      x, tipY
    );

    c.closePath();
  }

  function addShape(c, x, y, r, shape) {
    switch (shape) {
      case 'square':
        c.rect(x - r, y - r, r * 2, r * 2);
        break;
      case 'heart':
        addHeartPath(c, x, y, r);
        break;
      case 'star':
        addStarPath(c, x, y, r);
        break;
      case 'drop':
        addDropPath(c, x, y, r);
        break;
      case 'circle':
      default:
        c.moveTo(x + r, y);
        c.arc(x, y, r, 0, Math.PI * 2);
        break;
    }
  }

  /* 自定义图片缓存：把用户上传的图着色成 dotColor 后缓存 */
  const CUSTOM_CACHE_SIZE = 256;
  let customCacheCv = null;
  let customCacheSrc = null;

  function getCustomCanvas(colorHex) {
    const img = state.customImage;
    if (!img) return null;
    if (customCacheCv && customCacheSrc === colorHex) return customCacheCv;

    const S = CUSTOM_CACHE_SIZE;
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
    // contain 适配，保持宽高比
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const scale = Math.min(S / iw, S / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    c.drawImage(img, (S - dw) / 2, (S - dh) / 2, dw, dh);
    // 用 dotColor 给非透明像素着色
    c.globalCompositeOperation = 'source-in';
    c.fillStyle = colorHex;
    c.fillRect(0, 0, S, S);

    customCacheCv = cv;
    customCacheSrc = colorHex;
    return cv;
  }

  function invalidateCustomCache() {
    customCacheCv = null;
    customCacheSrc = null;
  }

  function render(state) {
    const t0 = performance.now();
    const { width: W, height: H } = state.canvasSize;
    if (canvas.width !== W || canvas.height !== H) {
      canvas.width = W; canvas.height = H;
    }

    canvas.dataset.shape = state.params.shape;

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    ctx.fillStyle = rgbToHex(state.backgroundColor);
    ctx.fillRect(0, 0, W, H);

    const dots = DotEngine.compute(W, H, {
      radius: state.params.radius,
      gap: state.params.gap,
      jitter: state.params.jitter / 100,
      sizeVariance: state.params.sizeVariance / 100,
      arrangement: state.params.arrangement,
      seed: state.params.seed,
    });

    const shape = state.params.shape;

    if (shape === 'custom') {
      const cv = getCustomCanvas(rgbToHex(state.dotColor));
      if (cv) {
        for (const d of dots) {
          ctx.drawImage(cv, d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
        }
      } else {
        // 未上传图片：画虚线占位 + 中央提示
        ctx.save();
        ctx.strokeStyle = 'rgba(74,64,64,0.22)';
        ctx.lineWidth = Math.max(1, W / 800);
        ctx.setLineDash([Math.max(4, W / 200), Math.max(4, W / 200)]);
        for (const d of dots) {
          ctx.strokeRect(d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
        }
        ctx.restore();

        ctx.save();
        const fs = Math.max(16, Math.min(W, H) / 22);
        ctx.fillStyle = 'rgba(74,64,64,0.55)';
        ctx.font = `600 ${fs}px "ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t('customEmptyHint'), W / 2, H / 2);
        ctx.restore();
      }
    } else if (dots.length <= 8000) {
      ctx.fillStyle = rgbToHex(state.dotColor);
      for (const d of dots) {
        ctx.beginPath();
        addShape(ctx, d.x, d.y, d.r, shape);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = rgbToHex(state.dotColor);
      ctx.beginPath();
      for (const d of dots) {
        addShape(ctx, d.x, d.y, d.r, shape);
      }
      ctx.fill();
    }

    if (CONFIG.debug.enabled && CONFIG.debug.showGridGuides) {
      const step = Math.max(1, state.params.radius * 2 + state.params.gap);
      const rowH = state.params.arrangement === 'hex' ? step * Math.sqrt(3) / 2 : step;
      ctx.save();
      ctx.strokeStyle = 'rgba(232,180,208,.7)';
      ctx.lineWidth = Math.max(1, W / 1600);
      ctx.setLineDash([6, 6]);
      for (let y = 0; y <= H; y += rowH) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      for (let x = 0; x <= W; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      ctx.restore();
    }

    state.renderTime = performance.now() - t0;
    state.dotCount = dots.length;
  }

  return { init, render, rgbToHex, addShape, invalidateCustomCache };
})();

/* =========================== PresetManager ============================== */
const PresetManager = (() => {
  const P = {
    default: { dot: { radius: 20, gap: 50, jitter: 0,  sizeVariance: 0,  arrangement: 'hex',    shape: 'circle' }, canvas: { width: 1600, height: 1000 } },
    compact: { dot: { radius: 8,  gap: 10, jitter: 15, sizeVariance: 10, arrangement: 'hex',    shape: 'circle' }, canvas: { width: 1920, height: 1080 } },
    sparse:  { dot: { radius: 24, gap: 60, jitter: 40, sizeVariance: 30, arrangement: 'hex',    shape: 'circle' }, canvas: { width: 1920, height: 1080 } },
    random:  { dot: { radius: 14, gap: 24, jitter: 80, sizeVariance: 60, arrangement: 'random', shape: 'circle' }, canvas: { width: 1920, height: 1080 } },
    pixel:   { dot: { radius: 6,  gap: 4,  jitter: 0,  sizeVariance: 0,  arrangement: 'grid',   shape: 'square' }, canvas: { width: 1080, height: 1080 } },
    heart:   { dot: { radius: 20, gap: 40, jitter: 15, sizeVariance: 20, arrangement: 'hex',    shape: 'heart'  }, canvas: { width: 1080, height: 1080 } },
    star:    { dot: { radius: 20, gap: 45, jitter: 25, sizeVariance: 30, arrangement: 'hex',    shape: 'star'   }, canvas: { width: 1080, height: 1080 } },
    rain:    { dot: { radius: 24, gap: 50, jitter: 10, sizeVariance: 15, arrangement: 'hex',    shape: 'drop'   }, canvas: { width: 1080, height: 1920 } },
    social:  { dot: { radius: 10, gap: 14, jitter: 20, sizeVariance: 15, arrangement: 'hex',    shape: 'circle' }, canvas: { width: 1080, height: 1080 } },
  };
  const applyToState = (id, state) => {
    const p = P[id];
    if (!p) return;
    Object.assign(state.params, p.dot);
    state.canvasSize.width = p.canvas.width;
    state.canvasSize.height = p.canvas.height;
  };
  return { applyToState };
})();

/* ============================ ImageLoader =============================== */
const ImageLoader = (() => {
  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      state.image = img;
      const thumb = $('#thumb');
      thumb.src = url;
      thumb.hidden = false;
      $('#dropHint').innerHTML = t('dropHintReplace');
      runExtraction();
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      $('#dropHint').innerHTML = t('dropHintError');
    };
    img.src = url;
  }
  function bind() {
    const drop = $('#drop');
    drop.addEventListener('click', () => $('#file').click());
    $('#file').addEventListener('change', (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (f) handleFile(f);
    });
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault(); drop.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
  }
  return { bind, handleFile };
})();

/* ==================== 自定义形状图片上传 ==================== */
const CustomLoader = (() => {
  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      state.customImage = img;
      const prev = $('#customPreview');
      prev.src = url;
      prev.hidden = false;
      $('#customHint').innerHTML = t('customHintReplace');
      CanvasRenderer.invalidateCustomCache();
      scheduleRender();
    };
    img.onerror = () => { URL.revokeObjectURL(url); };
    img.src = url;
  }
  function bind() {
    const drop = $('#customDrop');
    const file = $('#customFile');

    drop.addEventListener('click', (e) => {
      // 防止点击 file input 时冒泡导致重复触发
      if (e.target === file) return;
      file.click();
    });
    file.addEventListener('change', (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (f) handleFile(f);
    });

    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault(); drop.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
  }
  return { bind, handleFile };
})();

function runExtraction() {
  if (!state.image) return;
  try {
    const result = ColorExtractor.extract(state.image);
    state.dotColor = result.dotColor;
    state.backgroundColor = result.backgroundColor;
    state.candidates = result.candidates;
    state.sampleCanvas = result.sampleCanvas;
    state.autoPair = {
      dotColor: { ...result.dotColor },
      backgroundColor: { ...result.backgroundColor },
    };
    state.source = 'auto';
  } catch (err) {
    console.error('extract failed:', err);
    const f = CONFIG.extractor.fallbackColors;
    state.dotColor = hexToRgb(f[1]);
    state.backgroundColor = hexToRgb(f[0]);
  }
  syncColorUI();
  DebugManager.update(true);
  scheduleRender();
}

/* ============================== UIManager =============================== */
const UIManager = (() => {
  function bindColors() {
    $('#dotColor').addEventListener('input', (e) => {
      state.dotColor = hexToRgb(e.target.value); state.source = 'manual';
      syncColorUI(); scheduleRender();
    });
    $('#bgColor').addEventListener('input', (e) => {
      state.backgroundColor = hexToRgb(e.target.value); state.source = 'manual';
      syncColorUI(); scheduleRender();
    });
    $('#swapColors').addEventListener('click', () => {
      const tmp = state.dotColor; state.dotColor = state.backgroundColor; state.backgroundColor = tmp;
      state.source = 'manual'; syncColorUI(); scheduleRender();
    });
    $('#resetColors').addEventListener('click', () => {
      if (!state.autoPair) return;
      state.dotColor = { ...state.autoPair.dotColor };
      state.backgroundColor = { ...state.autoPair.backgroundColor };
      state.source = 'auto'; syncColorUI(); scheduleRender();
    });
  }
  function bindSliders() {
    [['radius','vRadius',v=>v+'px'],['gap','vGap',v=>v+'px'],
     ['jitter','vJitter',v=>v+'%'],['sizeVariance','vSize',v=>v+'%']]
      .forEach(([id, out, fmt]) => {
        const el = $('#' + id), o = $('#' + out);
        el.addEventListener('input', () => {
          state.params[id] = +el.value;
          o.textContent = fmt(el.value);
          scheduleRender();
        });
      });
    $('#arrangement').addEventListener('change', (e) => {
      state.params.arrangement = e.target.value; scheduleRender();
    });
    $('#shape').addEventListener('change', (e) => {
      state.params.shape = e.target.value;
      syncCustomRow();
      scheduleRender();
    });
  }
  function bindCanvas() {
    $('#cw').addEventListener('change', () => {
      state.canvasSize.width = Math.max(200, Math.min(CONFIG.canvas.maxWidth, +$('#cw').value || 1600));
      $('#cw').value = state.canvasSize.width; scheduleRender();
    });
    $('#ch').addEventListener('change', () => {
      state.canvasSize.height = Math.max(200, Math.min(CONFIG.canvas.maxHeight, +$('#ch').value || 1000));
      $('#ch').value = state.canvasSize.height; scheduleRender();
    });
    document.querySelectorAll('#sizeChips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        state.canvasSize.width = +btn.dataset.w;
        state.canvasSize.height = +btn.dataset.h;
        syncParamUI(); scheduleRender();
      });
    });
  }
  function bindPresets() {
    document.querySelectorAll('#presetChips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#presetChips .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        PresetManager.applyToState(btn.dataset.preset, state);
        syncParamUI(); scheduleRender();
      });
    });
  }
  function bindActions() {
    $('#shuffle').addEventListener('click', () => {
      state.params.seed = Math.floor(Math.random() * 1e9);
      scheduleRender();
    });
    $('#download').addEventListener('click', () => {
      const btn = $('#download');
      const old = btn.textContent;
      btn.disabled = true; btn.textContent = '…';
      const cv = $('#preview');
      cv.toBlob((blob) => {
        if (blob) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${CONFIG.export.filenamePrefix}-${cv.width}x${cv.height}-${Date.now()}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        }
        btn.disabled = false; btn.textContent = old;
      }, CONFIG.export.format);
    });
  }
  function bind() { bindColors(); bindSliders(); bindCanvas(); bindPresets(); bindActions(); }
  return { bind };
})();

/* ============================ DebugManager ============================== */
const DebugManager = (() => {
  let panel, lastUpdate = 0;
  function toggle() {
    CONFIG.debug.enabled = !CONFIG.debug.enabled;
    panel.classList.toggle('hidden', !CONFIG.debug.enabled);
    if (CONFIG.debug.enabled) update(true);
  }
  function update(force = false) {
    if (!CONFIG.debug.enabled) return;
    const now = performance.now();
    if (!force && now - lastUpdate < 80) return;
    lastUpdate = now;
    const dotLab = ColorService.rgbToLab(state.dotColor.r, state.dotColor.g, state.dotColor.b);
    const bgLab = ColorService.rgbToLab(state.backgroundColor.r, state.backgroundColor.g, state.backgroundColor.b);
    const dE = ColorService.deltaE(state.dotColor, state.backgroundColor);
    $('#dbgDot').textContent = `${rgbToHex(state.dotColor)} · L${dotLab.L.toFixed(0)}`;
    $('#dbgBg').textContent = `${rgbToHex(state.backgroundColor)} · L${bgLab.L.toFixed(0)}`;
    $('#dbgDe').textContent = dE.toFixed(1);
    $('#dbgSize').textContent = `${state.canvasSize.width}×${state.canvasSize.height}`;
    $('#dbgCount').textContent = state.dotCount.toLocaleString();
    $('#dbgTime').textContent = state.renderTime.toFixed(1) + ' ms';
    $('#dbgSeed').textContent = state.params.seed;
    $('#dbgShape').textContent = state.params.shape;
    const cands = $('#dbgCands');
    if (cands.childElementCount !== state.candidates.length) {
      cands.innerHTML = '';
      for (const c of state.candidates) {
        const s = document.createElement('span');
        s.style.background = rgbToHex(c);
        s.title = `${rgbToHex(c)} · ${(c.ratio * 100).toFixed(1)}%`;
        cands.appendChild(s);
      }
    }
    const img = $('#dbgSample');
    if (state.sampleCanvas && img.dataset.ready !== '1') {
      img.src = state.sampleCanvas.toDataURL();
      img.hidden = false;
      img.dataset.ready = '1';
    }
  }
  function updateGuidesBtn() {
    const on = CONFIG.debug.showGridGuides;
    $('#dbgGuides').textContent = on ? t('guidesOn') : t('guidesOff');
  }
  function bind() {
    panel = $('#debugPanel');
    window.addEventListener('keydown', (e) => {
      if (e.key === '`' || e.key === '~') { e.preventDefault(); toggle(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) {
        e.preventDefault(); toggle();
      }
    });
    $('#dbgGuides').addEventListener('click', () => {
      CONFIG.debug.showGridGuides = !CONFIG.debug.showGridGuides;
      updateGuidesBtn();
      scheduleRender();
    });
    $('#dbgExport').addEventListener('click', () => {
      const cfg = {
        colors: { dot: rgbToHex(state.dotColor), background: rgbToHex(state.backgroundColor) },
        params: { ...state.params },
        canvas: { ...state.canvasSize },
      };
      const str = JSON.stringify(cfg, null, 2);
      navigator.clipboard?.writeText(str).then(
        () => alert(t('copied') + '\n\n' + str),
        () => alert(str)
      );
    });
    window.__debug = {
      setDotColor: (r, g, b) => { state.dotColor = { r, g, b }; state.source = 'manual'; syncColorUI(); scheduleRender(); },
      setBackgroundColor: (r, g, b) => { state.backgroundColor = { r, g, b }; state.source = 'manual'; syncColorUI(); scheduleRender(); },
      swapColors: () => { const tmp = state.dotColor; state.dotColor = state.backgroundColor; state.backgroundColor = tmp; syncColorUI(); scheduleRender(); },
      setDotParams: (p) => { Object.assign(state.params, p); syncParamUI(); scheduleRender(); },
      setShape: (shape) => { state.params.shape = shape; syncParamUI(); scheduleRender(); },
      exportConfig: () => JSON.stringify({
        colors: { dot: rgbToHex(state.dotColor), bg: rgbToHex(state.backgroundColor) },
        params: state.params, canvas: state.canvasSize,
      }, null, 2),
    };
  }
  return { bind, update, toggle, updateGuidesBtn };
})();

/* ============================== 语言切换 ================================ */
const LangManager = (() => {
  function apply(lang) {
    currentLang = lang;
    document.documentElement.dataset.lang = lang;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (I18N[lang][key] !== undefined) el.textContent = I18N[lang][key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.dataset.i18nHtml;
      if (I18N[lang][key] !== undefined) el.innerHTML = I18N[lang][key];
    });

    const drop = $('#drop');
    drop.dataset.label = I18N[lang].dropLabel;
    if (state.image) {
      $('#dropHint').innerHTML = I18N[lang].dropHintReplace;
    } else {
      $('#dropHint').innerHTML = I18N[lang].dropHint;
    }

    const stage = $('#stage');
    stage.dataset.label = I18N[lang].preview;

    $('#langBtn').textContent = I18N[lang].langSwitch;
    document.title = I18N[lang].titleTag;

    syncColorUI();
    syncCustomRow();
    DebugManager.updateGuidesBtn();

    try { localStorage.setItem('polka-lang', lang); } catch (e) {}
  }

  function bind() {
    $('#langBtn').addEventListener('click', () => {
      apply(currentLang === 'zh' ? 'en' : 'zh');
    });
  }

  return { apply, bind };
})();

/* ==================== 全局粘贴分发 ==================== */
/* 当前形状为「自定义图片」时，粘贴的图片作为形状图片；
   其它形状时，粘贴的图片作为主图（提取颜色）。 */
function bindGlobalPaste() {
  window.addEventListener('paste', (e) => {
    const items = [...((e.clipboardData && e.clipboardData.items) || [])];
    const item = items.find(i => i.type.startsWith('image/'));
    if (!item) return;
    const file = item.getAsFile();
    if (!file) return;
    if (state.params.shape === 'custom') {
      CustomLoader.handleFile(file);
    } else {
      ImageLoader.handleFile(file);
    }
  });
}

/* ================================ 启动 ================================== */
(function init() {
  CanvasRenderer.init($('#preview'));
  UIManager.bind();
  ImageLoader.bind();
  CustomLoader.bind();
  bindGlobalPaste();
  DebugManager.bind();
  LangManager.bind();
  LangManager.apply(currentLang);
  syncParamUI();
  scheduleRender();
})();
</script>
